# DEVELOPMENT stack. It turns on demo credentials, a shared-secret JWT mode
# and permissive CORS, and loads demo seed data. Do not deploy it. The
# production example is docker-compose.prod.yml.
#
# Published ports bind to 127.0.0.1 unless BIND_ADDRESS is set.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-suez}
      POSTGRES_USER: ${POSTGRES_USER:-suez}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-suez}
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-suez} -d ${POSTGRES_DB:-suez}"
        ]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - suez-net

  # Applies migrations, then the demo seeds (development only).
  migrate:
    image: postgres:16-alpine
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-suez}:${POSTGRES_PASSWORD:-suez}@postgres:5432/${POSTGRES_DB:-suez}?sslmode=disable
    entrypoint: ["/bin/sh", "/scripts/migrate.sh", "/db/migrations", "/db/seeds"]
    volumes:
      - ../../scripts/migrate.sh:/scripts/migrate.sh:ro
      - ../db/migrations:/db/migrations:ro
      - ../db/seeds:/db/seeds:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - suez-net

  redis:
    image: redis:7-alpine
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - suez-net

  opa:
    build:
      context: ../../infra/opa
      dockerfile: Dockerfile
    ports:
      # Unauthenticated policy API: loopback only by default.
      - "${OPA_BIND:-127.0.0.1}:${OPA_PORT:-8181}:8181"
    networks:
      - suez-net

  # Optional local model for natural-language policy drafts. Without it the
  # control plane drafts from a template. Start with: --profile llm
  policy-llm:
    profiles: ["llm"]
    build:
      context: ../../infra/policy-llm
      dockerfile: Dockerfile
    environment:
      OLLAMA_KEEP_ALIVE: 15m
    ports:
      # Unauthenticated model API: loopback only by default.
      - "${POLICY_LLM_BIND:-127.0.0.1}:${POLICY_LLM_PORT:-11434}:11434"
    volumes:
      - ollama-data:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "OLLAMA_HOST=http://127.0.0.1:11434 ollama list >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
    networks:
      suez-net:
        aliases:
          - policy-llm

  policy-llm-init:
    profiles: ["llm"]
    image: ollama/ollama:0.3.14
    entrypoint:
      - /bin/sh
      - -lc
      - |
        export OLLAMA_HOST=http://policy-llm:11434
        until ollama list >/dev/null 2>&1; do sleep 2; done
        if ollama show "${POLICY_LLM_MODEL:-qwen2.5-coder:1.5b}" >/dev/null 2>&1; then
          echo "Pinned policy model already present: ${POLICY_LLM_MODEL:-qwen2.5-coder:1.5b}"
        else
          ollama pull "${POLICY_LLM_MODEL:-qwen2.5-coder:1.5b}"
        fi
    depends_on:
      policy-llm:
        condition: service_healthy
    networks:
      - suez-net

  tls-init:
    image: alpine:3.20
    environment:
      EDGE_HOST: ${EDGE_HOST:-suez.acrosystemsinc.ai}
    entrypoint:
      - /bin/sh
      - -lc
      - |
        apk add --no-cache openssl >/dev/null 2>&1
        mkdir -p /certs
        if [ ! -f /certs/localhost.crt ] || [ ! -f /certs/localhost.key ]; then
          openssl req -x509 -nodes -newkey rsa:2048 \
            -keyout /certs/localhost.key \
            -out /certs/localhost.crt \
            -days 365 \
            -subj "/CN=${EDGE_HOST}" \
            -addext "subjectAltName=DNS:${EDGE_HOST},IP:127.0.0.1"
        fi
        cat /certs/localhost.crt > /certs/localhost-fullchain.pem
    volumes:
      - ../tls/generated:/certs

  control-plane:
    build:
      context: ../../apps/control-plane
      dockerfile: Dockerfile
    environment:
      PORT: 8081
      SUEZ_ENV: development
      SUEZ_INTERNAL_TOKEN: ${SUEZ_INTERNAL_TOKEN:-suez-development-only-internal-token}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-*}
      SUEZ_EXPOSE_DEMO_CREDENTIALS: ${SUEZ_EXPOSE_DEMO_CREDENTIALS:-true}
      JWT_MODE: ${JWT_MODE:-dev-hs256}
      JWT_DEV_SECRET: ${JWT_DEV_SECRET:-suez-development-only-jwt-signing-secret}
      JWT_ISSUER: ${JWT_ISSUER:-}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-}
      JWT_JWKS_URL: ${JWT_JWKS_URL:-}
      SUEZ_DATA_KEY: ${SUEZ_DATA_KEY:-}
      DATABASE_URL: postgres://${POSTGRES_USER:-suez}:${POSTGRES_PASSWORD:-suez}@postgres:5432/${POSTGRES_DB:-suez}?sslmode=disable
      POSTGRES_ADDR: postgres:5432
      REDIS_ADDR: redis:6379
      OPA_HEALTH_URL: http://opa:8181/health
      POLICY_LLM_URL: http://policy-llm:11434/api/tags
      GATEWAY_BASE_URL: http://gateway:8080
      CONTROL_PLANE_BASE_URL: http://control-plane:8081
      OPA_BASE_URL: http://opa:8181
      OPA_DECISION_URL: http://opa:8181/v1/data/suez/authz/decision
      POLICY_LLM_BASE_URL: http://policy-llm:11434
      EDGE_BASE_URL: https://${EDGE_HOST:-suez.acrosystemsinc.ai}:${EDGE_HTTPS_PORT:-5443}
    volumes:
      - ../secrets:/run/suez-secrets:ro
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      opa:
        condition: service_started
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${CONTROL_PLANE_PORT:-8081}:8081"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8081/healthz >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - suez-net

  gateway:
    build:
      context: ../../apps/gateway
      dockerfile: Dockerfile
    environment:
      PORT: 8080
      SUEZ_ENV: development
      SUEZ_INTERNAL_TOKEN: ${SUEZ_INTERNAL_TOKEN:-suez-development-only-internal-token}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-*}
      CONTROL_PLANE_INTERNAL_URL: http://control-plane:8081
      DATABASE_URL: postgres://${POSTGRES_USER:-suez}:${POSTGRES_PASSWORD:-suez}@postgres:5432/${POSTGRES_DB:-suez}?sslmode=disable
      POSTGRES_ADDR: postgres:5432
      REDIS_ADDR: redis:6379
      OPA_HEALTH_URL: http://opa:8181/health
      OPA_DECISION_URL: http://opa:8181/v1/data/suez/authz/decision
      CONTROL_PLANE_HEALTH_URL: http://control-plane:8081/healthz
      AUTH_RESOLVER_URL: http://control-plane:8081/internal/auth/resolve
      POLICY_LLM_URL: http://policy-llm:11434/api/tags
      REDIS_URL: redis://redis:6379/0
      OPENAI_COMPAT_BASE_URL: https://api.openai.com/v1
      OPENAI_COMPAT_API_KEY: ${OPENAI_COMPAT_API_KEY:-}
      OPENAI_COMPAT_API_KEY_FILE: /run/suez-secrets/openai_compat_api_key
      GROQ_BASE_URL: ${GROQ_BASE_URL:-https://api.groq.com/openai/v1}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_API_KEY_FILE: /run/suez-secrets/groq_api_key
    volumes:
      - ../secrets:/run/suez-secrets:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      control-plane:
        condition: service_healthy
      opa:
        condition: service_started
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${GATEWAY_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/healthz >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - suez-net

  portal-ui:
    build:
      context: ../../apps/portal-ui
      dockerfile: Dockerfile
    environment:
      EDGE_HOST: ${EDGE_HOST:-suez.acrosystemsinc.ai}
      CONTROL_PLANE_PROXY_TARGET: http://control-plane:8081
      GATEWAY_PROXY_TARGET: http://gateway:8080
      VITE_CONTROL_PLANE_URL: /control-plane
      VITE_GATEWAY_URL: /gateway
    depends_on:
      control-plane:
        condition: service_healthy
      gateway:
        condition: service_healthy
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${PORTAL_UI_PORT:-5173}:5173"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5173 >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - suez-net

  edge:
    image: caddy:2.8-alpine
    environment:
      EDGE_HOST: ${EDGE_HOST:-suez.acrosystemsinc.ai}
      EDGE_HTTPS_PORT: ${EDGE_HTTPS_PORT:-5443}
    depends_on:
      tls-init:
        condition: service_completed_successfully
      portal-ui:
        condition: service_healthy
      control-plane:
        condition: service_healthy
      gateway:
        condition: service_healthy
      opa:
        condition: service_started
    ports:
      # Caddy listens on EDGE_HTTPS_PORT inside the container too, so the URL
      # the browser uses and the certificate host:port agree.
      - "${BIND_ADDRESS:-127.0.0.1}:${EDGE_HTTPS_PORT:-5443}:${EDGE_HTTPS_PORT:-5443}"
    volumes:
      - ../tls/Caddyfile:/etc/caddy/Caddyfile:ro
      - ../tls/generated:/certs:ro
    networks:
      - suez-net

networks:
  suez-net:
    driver: bridge

volumes:
  postgres-data:
  ollama-data:
